<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>Mobile Breathing Timer</title>
  <style>
    :root {
      --bg1: #06111f;
      --bg2: #10243e;
      --card: rgba(255, 255, 255, 0.10);
      --card2: rgba(255, 255, 255, 0.15);
      --line: rgba(255, 255, 255, 0.17);
      --text: #f8fafc;
      --soft: #cbd5e1;
      --muted: #94a3b8;
      --cyan: #67e8f9;
      --violet: #c084fc;
      --green: #86efac;
      --yellow: #fde68a;
      --red: #fca5a5;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(103, 232, 249, 0.24), transparent 34%),
        radial-gradient(circle at 90% 8%, rgba(192, 132, 252, 0.20), transparent 34%),
        linear-gradient(145deg, var(--bg1), var(--bg2));
    }

    body {
      min-height: 100dvh;
    }

    .app {
      width: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      padding-bottom: calc(16px + var(--safe-bottom));
    }

    header {
      padding: 6px 2px 10px;
    }

    .tag {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(103, 232, 249, 0.12);
      border: 1px solid rgba(103, 232, 249, 0.25);
      color: #a5f3fc;
      font-size: 12px;
      font-weight: 800;
    }

    h1 {
      margin: 10px 0 4px;
      font-size: clamp(28px, 9vw, 42px);
      line-height: 0.95;
      letter-spacing: -1.3px;
    }

    .subtitle {
      margin: 0;
      color: var(--soft);
      font-size: 14px;
      line-height: 1.45;
    }

    .breath-card {
      flex: 1;
      min-height: 430px;
      margin-top: 12px;
      border: 1px solid var(--line);
      background: linear-gradient(160deg, var(--card), rgba(255,255,255,0.055));
      border-radius: 30px;
      box-shadow: 0 26px 70px rgba(0,0,0,0.32);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .top-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 14px;
      position: relative;
      z-index: 5;
    }

    .stat {
      background: rgba(2, 6, 23, 0.24);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 10px 8px;
      text-align: center;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .stat strong {
      display: block;
      font-size: 17px;
      line-height: 1;
    }

    .stage {
      flex: 1;
      display: grid;
      place-items: center;
      min-height: 265px;
      position: relative;
      overflow: hidden;
    }

    .stage::before {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: rgba(103, 232, 249, 0.08);
      filter: blur(12px);
    }

    .orb-wrap {
      width: min(86vw, 380px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      position: relative;
    }

    .ring {
      position: absolute;
      inset: 7%;
      border-radius: 50%;
      border: 1px solid rgba(103, 232, 249, 0.20);
      transition: transform linear;
    }

    .ring.r2 {
      inset: 17%;
      border-color: rgba(192, 132, 252, 0.22);
    }

    .ring.r3 {
      inset: 27%;
      border-color: rgba(134, 239, 172, 0.18);
    }

    .orb {
      width: clamp(138px, 43vw, 178px);
      height: clamp(138px, 43vw, 178px);
      border-radius: 999px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 36% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0.22) 17%, transparent 28%),
        linear-gradient(135deg, rgba(103, 232, 249, 0.98), rgba(139, 92, 246, 0.98));
      box-shadow: 0 24px 80px rgba(103, 232, 249, 0.24), 0 0 55px rgba(192,132,252,0.20);
      transition: transform linear;
      z-index: 4;
    }

    .orb-content {
      text-align: center;
      font-weight: 1000;
      text-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    .orb-content span {
      display: block;
    }

    #phaseText {
      font-size: clamp(21px, 6vw, 30px);
      letter-spacing: -0.4px;
    }

    #countText {
      font-size: clamp(44px, 15vw, 64px);
      line-height: 0.95;
    }

    .instruction {
      text-align: center;
      padding: 0 18px 18px;
      position: relative;
      z-index: 5;
    }

    .instruction h2 {
      margin: 0;
      font-size: clamp(28px, 9vw, 48px);
      line-height: 1;
      letter-spacing: -1.2px;
    }

    .instruction p {
      margin: 8px auto 0;
      color: var(--soft);
      font-size: 14px;
      line-height: 1.4;
      max-width: 390px;
    }

    .progress-wrap {
      padding: 0 16px 16px;
    }

    .timeline {
      display: grid;
      grid-template-columns: var(--inhale, 4fr) var(--hold, 4fr) var(--exhale, 6fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .seg {
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.12);
      position: relative;
    }

    .seg::after {
      content: "";
      position: absolute;
      inset: 0;
      width: var(--fill, 0%);
      background: rgba(255,255,255,0.82);
      transition: width 0.12s linear;
    }

    .seg.inhale { background: rgba(103,232,249,0.25); }
    .seg.hold { background: rgba(253,230,138,0.22); }
    .seg.exhale { background: rgba(134,239,172,0.23); }

    .overall {
      height: 9px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.12);
    }

    .overall > div {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--violet), var(--green));
      transition: width 0.2s linear;
    }

    .controls {
      margin-top: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.085);
      border-radius: 28px;
      padding: 14px;
      backdrop-filter: blur(18px);
    }

    .preset-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .preset {
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.09);
      color: var(--text);
      border-radius: 18px;
      padding: 11px 10px;
      text-align: left;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
    }

    .preset small {
      display: block;
      color: var(--muted);
      font-weight: 800;
      margin-top: 2px;
    }

    .preset.active {
      background: rgba(103,232,249,0.18);
      border-color: rgba(103,232,249,0.45);
    }

    .inputs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .field label {
      display: block;
      font-size: 11px;
      color: var(--soft);
      font-weight: 900;
      margin: 0 0 6px;
      text-align: center;
    }

    .field input {
      width: 100%;
      min-height: 46px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(2, 6, 23, 0.34);
      color: var(--text);
      outline: none;
      text-align: center;
      font-size: 18px;
      font-weight: 1000;
    }

    .field input:focus {
      border-color: rgba(103,232,249,0.75);
      box-shadow: 0 0 0 4px rgba(103,232,249,0.12);
    }

    .button-row {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    button {
      min-height: 52px;
      border: 0;
      border-radius: 18px;
      color: var(--text);
      font-weight: 1000;
      font-size: 15px;
      cursor: pointer;
    }

    .start {
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      box-shadow: 0 12px 30px rgba(6,182,212,0.20);
    }

    .pause {
      background: rgba(255,255,255,0.13);
      border: 1px solid rgba(255,255,255,0.16);
    }

    .reset {
      background: rgba(248, 113, 113, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.24);
      color: #fecaca;
    }

    .bottom-options {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .toggle {
      flex: 1;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: var(--soft);
      border: 1px solid rgba(255,255,255,0.13);
      background: rgba(255,255,255,0.07);
      border-radius: 16px;
      font-size: 13px;
      font-weight: 900;
    }

    .toggle input {
      accent-color: #67e8f9;
    }

    .msg {
      min-height: 20px;
      margin-top: 10px;
      text-align: center;
      color: var(--red);
      font-size: 12.5px;
      font-weight: 800;
    }

    .done {
      color: var(--green);
    }

    @media (min-width: 720px) {
      .app {
        max-width: 520px;
        margin: 0 auto;
      }
    }

    @media (max-width: 380px) {
      .app { padding: 12px; }
      .top-stats { gap: 6px; padding: 12px; }
      .stat strong { font-size: 15px; }
      .inputs { gap: 6px; }
      .field label { font-size: 10px; }
      .field input { font-size: 16px; min-height: 43px; }
      .button-row { grid-template-columns: 1fr; }
      button { min-height: 48px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="tag">● Mobile breathing guide</div>
      <h1>Calm Breath</h1>
      <p class="subtitle">Set inhale, hold, exhale and total time. Follow the circle.</p>
    </header>

    <section class="breath-card">
      <div class="top-stats">
        <div class="stat">
          <span>PHASE</span>
          <strong id="phaseStat">Ready</strong>
        </div>
        <div class="stat">
          <span>LEFT</span>
          <strong id="phaseLeft">--</strong>
        </div>
        <div class="stat">
          <span>TOTAL</span>
          <strong id="totalLeft">03:00</strong>
        </div>
      </div>

      <div class="stage">
        <div class="orb-wrap">
          <div class="ring" id="ring1"></div>
          <div class="ring r2" id="ring2"></div>
          <div class="ring r3" id="ring3"></div>

          <div class="orb" id="orb">
            <div class="orb-content">
              <span id="phaseText">Ready</span>
              <span id="countText">--</span>
            </div>
          </div>
        </div>
      </div>

      <div class="instruction">
        <h2 id="instruction">Get Ready</h2>
        <p id="coach">Sit comfortably. Relax your shoulders. Tap Start when ready.</p>
      </div>

      <div class="progress-wrap">
        <div class="timeline" id="timeline">
          <div class="seg inhale" id="segInhale"></div>
          <div class="seg hold" id="segHold"></div>
          <div class="seg exhale" id="segExhale"></div>
        </div>
        <div class="overall">
          <div id="overallBar"></div>
        </div>
      </div>
    </section>

    <section class="controls">
      <div class="preset-row">
        <button class="preset active" data-i="4" data-h="4" data-e="6">Calm<small>4 · 4 · 6</small></button>
        <button class="preset" data-i="4" data-h="7" data-e="8">Relax<small>4 · 7 · 8</small></button>
        <button class="preset" data-i="4" data-h="4" data-e="4">Box<small>4 · 4 · 4</small></button>
        <button class="preset" data-i="5" data-h="0" data-e="5">Flow<small>5 · 0 · 5</small></button>
      </div>

      <div class="inputs">
        <div class="field">
          <label for="inhale">Inhale</label>
          <input id="inhale" type="number" min="1" max="30" value="4" />
        </div>
        <div class="field">
          <label for="hold">Hold</label>
          <input id="hold" type="number" min="0" max="30" value="4" />
        </div>
        <div class="field">
          <label for="exhale">Exhale</label>
          <input id="exhale" type="number" min="1" max="30" value="6" />
        </div>
        <div class="field">
          <label for="minutes">Min</label>
          <input id="minutes" type="number" min="1" max="60" value="3" />
        </div>
      </div>

      <div class="button-row">
        <button class="start" id="startBtn">Start</button>
        <button class="pause" id="pauseBtn">Pause</button>
        <button class="reset" id="resetBtn">Reset</button>
      </div>

      <div class="bottom-options">
        <label class="toggle"><input id="sound" type="checkbox" checked /> Sound</label>
        <label class="toggle"><input id="vibrate" type="checkbox" /> Vibration</label>
      </div>

      <div class="msg" id="msg"></div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    const inhale = $("inhale");
    const hold = $("hold");
    const exhale = $("exhale");
    const minutes = $("minutes");

    const phaseStat = $("phaseStat");
    const phaseLeft = $("phaseLeft");
    const totalLeft = $("totalLeft");
    const phaseText = $("phaseText");
    const countText = $("countText");
    const instruction = $("instruction");
    const coach = $("coach");
    const orb = $("orb");
    const ring1 = $("ring1");
    const ring2 = $("ring2");
    const ring3 = $("ring3");
    const timeline = $("timeline");
    const segInhale = $("segInhale");
    const segHold = $("segHold");
    const segExhale = $("segExhale");
    const overallBar = $("overallBar");
    const msg = $("msg");

    const startBtn = $("startBtn");
    const pauseBtn = $("pauseBtn");
    const resetBtn = $("resetBtn");
    const sound = $("sound");
    const vibrate = $("vibrate");

    let cfg = { i: 4, h: 4, e: 6, m: 3 };
    let totalMs = cfg.m * 60000;
    let elapsed = 0;
    let phaseElapsed = 0;
    let phase = "ready";
    let running = false;
    let paused = false;
    let interval = null;
    let last = 0;
    let audioCtx = null;

    function clamp(v, min, max, fallback) {
      const n = Number(v);
      if (!Number.isFinite(n)) return fallback;
      return Math.min(max, Math.max(min, n));
    }

    function readCfg() {
      cfg = {
        i: clamp(inhale.value, 1, 30, 4),
        h: clamp(hold.value, 0, 30, 4),
        e: clamp(exhale.value, 1, 30, 6),
        m: clamp(minutes.value, 1, 60, 3)
      };

      inhale.value = cfg.i;
      hold.value = cfg.h;
      exhale.value = cfg.e;
      minutes.value = cfg.m;

      totalMs = cfg.m * 60000;
      timeline.style.setProperty("--inhale", Math.max(cfg.i, 0.1) + "fr");
      timeline.style.setProperty("--hold", Math.max(cfg.h, 0.1) + "fr");
      timeline.style.setProperty("--exhale", Math.max(cfg.e, 0.1) + "fr");
      segHold.style.display = cfg.h === 0 ? "none" : "block";
    }

    function format(ms) {
      const s = Math.max(0, Math.ceil(ms / 1000));
      const m = String(Math.floor(s / 60)).padStart(2, "0");
      const r = String(s % 60).padStart(2, "0");
      return `${m}:${r}`;
    }

    function dur() {
      if (phase === "inhale") return cfg.i * 1000;
      if (phase === "hold") return cfg.h * 1000;
      if (phase === "exhale") return cfg.e * 1000;
      return 1000;
    }

    function beep(type) {
      if (!sound.checked) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = type === "inhale" ? 520 : type === "hold" ? 410 : type === "exhale" ? 330 : 650;
        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.04, audioCtx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.22);
      } catch(e) {}
    }

    function buzz(type) {
      if (!vibrate.checked || !navigator.vibrate) return;
      navigator.vibrate(type === "exhale" ? [35, 35, 35] : 40);
    }

    function scaleOrb(scale, ms) {
      const seconds = Math.max(0.1, ms / 1000);
      [orb, ring1, ring2, ring3].forEach(el => el.style.transitionDuration = seconds + "s");
      orb.style.transform = `scale(${scale})`;
      ring1.style.transform = `scale(${0.85 + scale * 0.32})`;
      ring2.style.transform = `scale(${0.80 + scale * 0.25})`;
      ring3.style.transform = `scale(${0.78 + scale * 0.16})`;
    }

    function clearSegments() {
      [segInhale, segHold, segExhale].forEach(s => s.style.setProperty("--fill", "0%"));
    }

    function setPhase(next) {
      phase = next;
      phaseElapsed = 0;
      clearSegments();

      const title = next.charAt(0).toUpperCase() + next.slice(1);
      phaseStat.textContent = title;
      phaseText.textContent = title;

      if (next === "inhale") {
        instruction.textContent = "Inhale";
        coach.textContent = "Breathe in slowly as the circle grows.";
        scaleOrb(1.65, cfg.i * 1000);
      } else if (next === "hold") {
        instruction.textContent = "Hold";
        coach.textContent = "Stay relaxed. Keep the breath soft.";
        scaleOrb(1.65, 200);
      } else if (next === "exhale") {
        instruction.textContent = "Exhale";
        coach.textContent = "Release slowly as the circle becomes smaller.";
        scaleOrb(1, cfg.e * 1000);
      }

      beep(next);
      buzz(next);
    }

    function nextPhase() {
      if (phase === "inhale") {
        if (cfg.h > 0) setPhase("hold");
        else setPhase("exhale");
      } else if (phase === "hold") {
        setPhase("exhale");
      } else {
        setPhase("inhale");
      }
    }

    function update() {
      const left = dur() - phaseElapsed;
      const phaseProgress = Math.min(100, Math.max(0, phaseElapsed / dur() * 100));
      const totalProgress = Math.min(100, Math.max(0, elapsed / totalMs * 100));

      phaseLeft.textContent = Math.max(0, Math.ceil(left / 1000)) + "s";
      countText.textContent = Math.max(0, Math.ceil(left / 1000));
      totalLeft.textContent = format(totalMs - elapsed);
      overallBar.style.width = totalProgress + "%";

      if (phase === "inhale") segInhale.style.setProperty("--fill", phaseProgress + "%");
      if (phase === "hold") segHold.style.setProperty("--fill", phaseProgress + "%");
      if (phase === "exhale") segExhale.style.setProperty("--fill", phaseProgress + "%");
    }

    function validate() {
      readCfg();
      const cycle = cfg.i + cfg.h + cfg.e;
      if (cycle > cfg.m * 60) {
        msg.className = "msg";
        msg.textContent = "One full cycle is longer than total time.";
        return false;
      }
      msg.textContent = "";
      return true;
    }

    function start() {
      if (!validate()) return;
      clearInterval(interval);
      running = true;
      paused = false;
      elapsed = 0;
      phaseElapsed = 0;
      last = performance.now();

      startBtn.textContent = "Restart";
      pauseBtn.textContent = "Pause";
      msg.className = "msg";
      msg.textContent = "";

      setPhase("inhale");
      update();

      interval = setInterval(tick, 80);
    }

    function tick() {
      if (!running || paused) return;
      const now = performance.now();
      const delta = now - last;
      last = now;

      elapsed += delta;
      phaseElapsed += delta;

      if (elapsed >= totalMs) {
        finish();
        return;
      }

      if (phaseElapsed >= dur()) nextPhase();
      update();
    }

    function pause() {
      if (!running) return;
      paused = !paused;
      pauseBtn.textContent = paused ? "Resume" : "Pause";

      if (paused) {
        instruction.textContent = "Paused";
        coach.textContent = "Tap Resume when you are ready.";
        [orb, ring1, ring2, ring3].forEach(el => el.style.transitionDuration = "0s");
      } else {
        last = performance.now();
        if (phase === "inhale") instruction.textContent = "Inhale";
        if (phase === "hold") instruction.textContent = "Hold";
        if (phase === "exhale") instruction.textContent = "Exhale";
      }
    }

    function reset() {
      clearInterval(interval);
      running = false;
      paused = false;
      readCfg();
      elapsed = 0;
      phaseElapsed = 0;
      phase = "ready";

      phaseStat.textContent = "Ready";
      phaseLeft.textContent = "--";
      totalLeft.textContent = format(totalMs);
      phaseText.textContent = "Ready";
      countText.textContent = "--";
      instruction.textContent = "Get Ready";
      coach.textContent = "Sit comfortably. Relax your shoulders. Tap Start when ready.";
      overallBar.style.width = "0%";
      clearSegments();
      scaleOrb(1, 250);

      startBtn.textContent = "Start";
      pauseBtn.textContent = "Pause";
      msg.className = "msg";
      msg.textContent = "";
    }

    function finish() {
      clearInterval(interval);
      running = false;
      paused = false;
      elapsed = totalMs;

      phaseStat.textContent = "Done";
      phaseLeft.textContent = "--";
      totalLeft.textContent = "00:00";
      phaseText.textContent = "Done";
      countText.textContent = "✓";
      instruction.textContent = "Well done";
      coach.textContent = "Stay still for a few seconds and notice the calm.";
      overallBar.style.width = "100%";
      scaleOrb(1.18, 400);
      beep("done");
      buzz("done");

      msg.className = "msg done";
      msg.textContent = "Session complete.";
      startBtn.textContent = "Start Again";
      pauseBtn.textContent = "Pause";
    }

    document.querySelectorAll(".preset").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".preset").forEach(x => x.classList.remove("active"));
        btn.classList.add("active");
        inhale.value = btn.dataset.i;
        hold.value = btn.dataset.h;
        exhale.value = btn.dataset.e;
        if (!running) reset();
      });
    });

    [inhale, hold, exhale, minutes].forEach(input => {
      input.addEventListener("input", () => {
        document.querySelectorAll(".preset").forEach(x => x.classList.remove("active"));
        if (!running) reset();
      });
    });

    startBtn.addEventListener("click", start);
    pauseBtn.addEventListener("click", pause);
    resetBtn.addEventListener("click", reset);

    reset();
  </script>
</body>
</html>
